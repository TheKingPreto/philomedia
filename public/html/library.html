<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage your personal watchlist, favorites, and watched works inside PhiloMedia.">
  <meta name="theme-color" content="#0d0e14">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="author" content="Lucas Silva">
  <title>PhiloMedia | Library</title>
  <link rel="canonical" href="/html/library.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles/base.css">
  <link rel="stylesheet" href="/css/styles/animations.css">
</head>
<body class="library-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <div class="header-brand">
      <a href="/html/index.html" class="logo">PhiloMedia</a>
      <span class="header-context">Your Library</span>
    </div>
    <nav aria-label="Primary">
      <a href="/html/index.html">Home</a>
      <a href="/html/search.html">Search</a>
      <a href="/html/philosophers.html">Thinkers</a>
      <a href="/html/library.html" data-auth-link="library" aria-current="page" hidden>Library</a>
      <span id="nav-auth-slot" class="nav-auth-slot"></span>
    </nav>
  </header>

  <main id="main-content" class="library-shell">
    <section class="library-hero">
      <h1 class="section-title">Your saved works</h1>
      <p id="library-intro" class="section-subtitle">Build a personal map of films and series to revisit later.</p>
    </section>

    <section id="library-toolbar" class="library-toolbar" hidden>
      <label class="library-search-field" for="library-search">
        <span class="filter-label">Search your library</span>
        <input type="search" id="library-search" placeholder="Find a saved title..." autocomplete="off">
      </label>
      <div class="library-toolbar-row">
        <div class="filter-cluster library-filter-group">
          <p class="filter-label">Media</p>
          <div id="library-media-filters" class="filter-chip-row" aria-label="Filter library by media type"></div>
        </div>
        <label class="sort-control" for="library-sort">
          <span>Sort by</span>
          <select id="library-sort" aria-label="Sort library works"></select>
        </label>
        <button type="button" id="clear-library-filters" class="ghost-button">Clear filters</button>
      </div>
    </section>

    <section id="watchlist-section" class="library-section">
      <div class="results-meta">
        <div class="results-meta-copy">
          <h2 class="section-title">Watchlist</h2>
          <p class="section-subtitle">Titles you want to come back to.</p>
        </div>
      </div>
      <div id="watchlist-grid" class="results-grid"></div>
    </section>

    <section id="favorites-section" class="library-section">
      <div class="results-meta">
        <div class="results-meta-copy">
          <h2 class="section-title">Favorites</h2>
          <p class="section-subtitle">Works that stayed with you.</p>
        </div>
      </div>
      <div id="favorites-grid" class="results-grid"></div>
    </section>

    <section id="watched-section" class="library-section">
      <div class="results-meta">
        <div class="results-meta-copy">
          <h2 class="section-title">Watched</h2>
          <p class="section-subtitle">Works you have already experienced.</p>
        </div>
      </div>
      <div id="watched-grid" class="results-grid"></div>
    </section>
  </main>

  <script type="module" src="/scripts/library.js"></script>
</body>
</html>
