  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PhiloMedia | Thinker">

  <link rel="canonical" href="/html/philosopher.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles/base.css">
  <link rel="stylesheet" href="/css/styles/animations.css">

<body class="philosopher-detail-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <div class="header-brand">
      <a href="/html/index.html" class="logo">PhiloMedia</a>
      <span class="header-context">Thinkers</span>
    </div>
    <nav aria-label="Primary">
      <a href="/html/index.html">Home</a>
      <a href="/html/search.html">Search</a>
      <a href="/html/philosophers.html" aria-current="page">Thinkers</a>
      <a href="/html/library.html" data-auth-link="library" hidden>Library</a>
      <span id="nav-auth-slot" class="nav-auth-slot"></span>
    </nav>
  </header>

  <main id="main-content" class="philosopher-detail-shell">
    <section id="philosopher-state"></section>

    <section id="philosopher-content" hidden>
      <section class="philosopher-hero">
        <div class="profile-copy">
          <p class="profile-eyebrow">Thinker portrait</p>
          <div class="philosopher-hero-head">
            <div class="philosopher-title-block">
              <h1 id="philosopher-name" class="section-title">Thinker</h1>
              <p id="philosopher-period" class="section-subtitle"></p>
            </div>
            <div id="philosopher-sigil" class="philosopher-sigil" aria-hidden="true"></div>
          </div>
          <p id="philosopher-summary" class="profile-summary"></p>
          <p id="philosopher-focus" class="philosopher-focus"></p>
          <div id="philosopher-lenses" class="philosopher-chip-row philosopher-chip-row-links" aria-label="Related search lenses"></div>
        </div>
      </section>

      <section id="philosopher-stats" class="profile-stats" aria-label="Thinker stats"></section>

      <section class="philosopher-section-grid">
        <article class="profile-panel philosopher-panel-compact">
          <div class="results-meta">
            <div class="results-meta-copy">
              <h2 class="section-title">Signature quotes</h2>
              <p class="section-subtitle">The lines in this collection that most clearly shape this thinker's presence on the site.</p>
            </div>
          </div>
          <div id="philosopher-quotes" class="philosopher-quote-grid"></div>
        </article>

        <article class="profile-panel">
          <div class="results-meta">
            <div class="results-meta-copy">
              <h2 class="section-title">Related works</h2>
              <p id="philosopher-works-summary" class="section-subtitle">Works connected through curated quote pairings and thematic discovery.</p>
            </div>
          </div>
          <div id="philosopher-works" class="results-grid"></div>
        </article>
      </section>
    </section>
  </main>

  <script type="module" src="/scripts/philosopher.js"></script>
</body>
</html>
