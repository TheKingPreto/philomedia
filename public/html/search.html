<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Lucas Silva">
  <title>PhiloMedia | Search</title>

  <link rel="stylesheet" href="/css/styles/base.css">
  <link rel="stylesheet" href="/css/styles/animations.css">
</head>
<body>
  <header>
    <div class="header-brand">
      <a href="/html/index.html" class="logo">PhiloMedia</a>
      <span class="header-context">Search</span>
    </div>
    <nav>
      <a href="/html/index.html">Home</a>
      <a href="/html/search.html" aria-current="page">Search</a>
      <a href="/html/library.html" data-auth-link="library" hidden>Library</a>
      <span id="nav-auth-slot" class="nav-auth-slot"></span>
    </nav>
  </header>

  <main>
    <section class="search-section">
      <h2 class="section-title">Find movies &amp; series</h2>
      <p class="section-subtitle">Search by title or start from a philosophical lens to discover works and their connections.</p>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="e.g. Interstellar, Breaking Bad..." autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div class="search-discovery">
        <div class="filter-cluster">
          <p class="filter-label">Suggested lenses</p>
          <div id="lens-suggestions" class="filter-chip-row" aria-label="Suggested philosophical lenses"></div>
        </div>
        <div id="search-toolbar" class="search-toolbar" hidden>
          <div class="filter-cluster">
            <p class="filter-label">Media</p>
            <div id="media-filters" class="filter-chip-row" aria-label="Filter by media type"></div>
          </div>
          <div class="filter-cluster">
            <p class="filter-label">Rating</p>
            <div id="rating-filters" class="filter-chip-row" aria-label="Filter by TMDB rating"></div>
          </div>
          <button type="button" id="clear-search-filters" class="ghost-button">Clear filters</button>
        </div>
      </div>
    </section>
    <section id="search-results-section">
      <div id="search-results-meta" class="results-meta" hidden>
        <div class="results-meta-copy">
          <h3 id="search-results-title" class="section-title">Search results</h3>
          <p id="search-results-summary" class="section-subtitle"></p>
        </div>
        <label class="sort-control" for="sort-select">
          <span>Sort</span>
          <select id="sort-select" aria-label="Sort results"></select>
        </label>
      </div>
      <div id="search-results" class="results-grid"></div>
    </section>
  </main>

  <script type="module" src="/scripts/search.js"></script>
</body>
</html>
