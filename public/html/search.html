<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search films and series through philosophical lenses, rating filters, and theme-driven discovery inside PhiloMedia.">
  <meta name="theme-color" content="#0d0e14">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index,follow">
  <meta name="author" content="Lucas Silva">
  <meta property="og:title" content="PhiloMedia | Search">
  <meta property="og:description" content="Search films and series through philosophical lenses, rating filters, and theme-driven discovery inside PhiloMedia.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PhiloMedia">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PhiloMedia | Search">
  <meta name="twitter:description" content="Search films and series through philosophical lenses, rating filters, and theme-driven discovery inside PhiloMedia.">
  <title>PhiloMedia | Search</title>
  <link rel="canonical" href="/html/search.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles/base.css">
  <link rel="stylesheet" href="/css/styles/animations.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <div class="header-brand">
      <a href="/html/index.html" class="logo">PhiloMedia</a>
      <span class="header-context">Search</span>
    </div>
    <nav aria-label="Primary">
      <a href="/html/index.html">Home</a>
      <a href="/html/search.html" aria-current="page">Search</a>
      <a href="/html/philosophers.html">Thinkers</a>
      <a href="/html/library.html" data-auth-link="library" hidden>Library</a>
      <span id="nav-auth-slot" class="nav-auth-slot"></span>
    </nav>
  </header>

  <main id="main-content">
    <section class="search-section">
      <h2 class="section-title">Find movies &amp; series</h2>
      <p class="section-subtitle">Search by title or start from a philosophical lens to discover works and their connections.</p>
      <form id="search-form" role="search">
        <label for="search-input" class="sr-only">Search for a movie or series</label>
        <input type="search" id="search-input" placeholder="e.g. Interstellar, Breaking Bad..." autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div class="search-discovery">
        <div class="filter-cluster">
          <p class="filter-label">Suggested lenses</p>
          <div id="lens-suggestions" class="filter-chip-row" aria-label="Suggested philosophical lenses"></div>
        </div>
        <div id="search-toolbar" class="search-toolbar" hidden>
          <div class="filter-cluster">
            <p class="filter-label">Media</p>
            <div id="media-filters" class="filter-chip-row" aria-label="Filter by media type"></div>
          </div>
          <div class="filter-cluster">
            <p class="filter-label">Rating</p>
            <div id="rating-filters" class="filter-chip-row" aria-label="Filter by TMDB rating"></div>
          </div>
          <button type="button" id="clear-search-filters" class="ghost-button">Clear filters</button>
        </div>
      </div>
    </section>
    <section id="search-results-section" aria-live="polite">
      <div id="search-results-meta" class="results-meta" hidden>
        <div class="results-meta-copy">
          <h3 id="search-results-title" class="section-title">Search results</h3>
          <p id="search-results-summary" class="section-subtitle"></p>
        </div>
        <label class="sort-control" for="sort-select">
          <span>Sort</span>
          <select id="sort-select" aria-label="Sort results"></select>
        </label>
      </div>
      <div id="search-results" class="results-grid"></div>
    </section>
  </main>

  <script type="module" src="/scripts/pages/search.page.js"></script>
</body>
</html>
