<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Lucas Silva">
  <title>PhiloMedia | Search</title>

  <link rel="stylesheet" href="/css/styles/base.css">
  <link rel="stylesheet" href="/css/styles/animations.css">
</head>
<body>
  <header>
    <div class="header-brand">
      <a href="/html/index.html" class="logo">PhiloMedia</a>
      <span class="header-context">Search</span>
    </div>
    <nav>
      <a href="/html/index.html">Home</a>
      <a href="/html/search.html" aria-current="page">Search</a>
    </nav>
  </header>

  <main>
    <section class="search-section">
      <h2 class="section-title">Find movies &amp; series</h2>
      <p class="section-subtitle">Search by title to discover works and their philosophical connections.</p>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="e.g. Interstellar, Breaking Bad..." autocomplete="off" />
        <button type="submit">Search</button>
      </form>
    </section>
    <div id="search-results" class="results-grid"></div>
  </main>

  <script type="module" src="/scripts/search.js"></script>
</body>
</html>
