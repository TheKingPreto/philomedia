<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read a philosophical interpretation of a film or series, paired with quotes and related works inside PhiloMedia.">
  <meta name="theme-color" content="#0d0e14">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index,follow">
  <meta name="author" content="Lucas Silva">
  <meta property="og:title" content="PhiloMedia | Details">
  <meta property="og:description" content="Read a philosophical interpretation of a film or series, paired with quotes and related works inside PhiloMedia.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="PhiloMedia">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PhiloMedia | Details">
  <meta name="twitter:description" content="Read a philosophical interpretation of a film or series, paired with quotes and related works inside PhiloMedia.">
  <title>PhiloMedia | Details</title>
  <link rel="canonical" href="/html/details.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles/base.css">
  <link rel="stylesheet" href="/css/styles/animations.css">
  <link rel="stylesheet" href="/css/styles/details-loading.css">
  <link rel="stylesheet" href="/css/styles/details.css">
</head>
<body class="details-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="details-header">
    <div class="header-brand">
      <a href="/html/index.html" class="logo">PhiloMedia</a>
      <span class="header-context">Media Reading</span>
    </div>
    <nav aria-label="Primary">
      <a href="/html/index.html">Home</a>
      <a href="/html/search.html">Search</a>
      <a href="/html/philosophers.html">Thinkers</a>
      <a href="/html/library.html" data-auth-link="library" hidden>Library</a>
      <span id="nav-auth-slot" class="nav-auth-slot"></span>
    </nav>
  </header>
  <main id="main-content">
    <section id="details-container">
      <div class="details-poster">
        <img id="details-image" src="" alt="" loading="lazy">
      </div>
      <div class="details-info">
        <h1 id="details-title"></h1>
        <p id="details-meta"></p>
        <div id="details-facts" class="details-facts" aria-label="Work details"></div>
        <div id="details-actions" class="details-actions" hidden>
          <button type="button" id="watchlist-button" class="library-action-button">Save to watchlist</button>
          <button type="button" id="favorite-button" class="library-action-button">Add to favorites</button>
          <button type="button" id="watched-button" class="library-action-button">Mark as watched</button>
        </div>
        <p id="details-actions-hint" class="details-actions-hint" hidden></p>
        <p id="details-attribution" class="details-attribution" hidden></p>
        <p id="details-overview"></p>
      </div>
    </section>

    <section id="philosophy-quote">
      <h2>Related Philosophical Reading</h2>

      <div id="static-quote">
        <p id="quote-text" class="quote-text"></p>
        <span id="quote-author" class="quote-author"></span>
      </div>

      <div id="ai-quote-container">
        <div class="ai-placeholder">
          <span class="ai-thinking-dot"></span>
          <span>AI interpretive reading in progress</span>
        </div>
      </div>
    </section>

    <section id="related-works" hidden>
      <div class="related-header">
        <h2 class="section-title">Related Works</h2>
        <p class="section-subtitle">More titles that orbit the same themes, genres, or mood.</p>
      </div>
      <div id="related-results"></div>
    </section>
  </main>

  <script type="module" src="/scripts/pages/details.page.js"></script>
</body>
</html>
